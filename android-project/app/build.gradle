apply plugin: 'com.android.application'

android {
    namespace "org.mamedev.mame"
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.mamedev.mame"
        minSdkVersion 24
        targetSdkVersion 35
        ndk {
            moduleName 'main'
        }
    }

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

    lintOptions {
        abortOnError false
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir 'src/main/libs'
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/*.so"]
            useLegacyPackaging = true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

task copyFiles_bgfx(type: Copy)
task copyFiles_language(type: Copy)

copyFiles_bgfx {
    from '../../bgfx'
    into 'src/main/assets/bgfx'
    include('**/*')
}
copyFiles_language {
    from '../../language'
    into 'src/main/assets/language'
    include('**/*.mo')
}

preBuild.dependsOn copyFiles_bgfx
preBuild.dependsOn copyFiles_language
