name: Sharded build

on:
  workflow_call:
    inputs:
      profile_path:
        description: CI shard profile map path
        required: true
        type: string
      profile_id:
        description: CI shard profile ID
        required: true
        type: string
      groups:
        description: JSON array of fixed shard groups
        required: true
        type: string
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
      shell:
        description: Default shell for run steps
        required: true
        type: string
      install_kind:
        description: Dependency installation mode
        required: true
        type: string
      msystem:
        description: MSYS2 system name, or empty for non-MSYS2 profiles
        required: true
        type: string
      packages:
        description: Dependency packages
        required: true
        type: string
      python:
        description: Python command
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-shards:
    name: build (${{ inputs.profile_id }} ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.groups) }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: ${{ inputs.shell }}
    env:
      CI_PACKAGES: ${{ inputs.packages }}
      CI_PYTHON: ${{ inputs.python }}
    steps:
    - name: Set up MSYS2
      if: inputs.install_kind == 'msys2'
      uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
      with:
        msystem: ${{ inputs.msystem }}
        install: ${{ inputs.packages }}
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Validate profile inputs
      id: profile
      run: |
        set -euo pipefail
        "$CI_PYTHON" scripts/build/ci_shards.py github-env \
          --profile "${{ inputs.profile_path }}" \
          --group "${{ matrix.group }}" \
          --expected-profile-id "${{ inputs.profile_id }}" \
          --expected-runner "${{ inputs.runner }}" \
          --expected-shell "${{ inputs.shell }}" \
          --expected-install-kind "${{ inputs.install_kind }}" \
          --expected-msystem "${{ inputs.msystem }}" \
          --expected-packages "$CI_PACKAGES" \
          --expected-python "${{ inputs.python }}" \
          --github-output "$GITHUB_OUTPUT" \
          --github-env "$GITHUB_ENV"
    - name: Install apt dependencies
      if: inputs.install_kind == 'apt'
      run: |
        sudo apt-get update
        sudo apt-get install -y $CI_PACKAGES
    - name: Install Homebrew dependencies
      if: inputs.install_kind == 'brew'
      run: brew install $CI_PACKAGES
    - name: Generate shard build files
      run: |
        set -euo pipefail
        make -j"$CI_MAKE_JOBS" generate
        make "$CI_SOLUTION_DIR/Makefile"
        "$CI_PYTHON" scripts/build/ci_shards.py validate \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}"
    - name: Capture toolchain identity
      id: cache-context
      run: |
        set -euo pipefail
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        toolchain_file="$state_root/toolchain.txt"
        mkdir -p "$state_root"
        ar_tool="${OVERRIDE_AR:-ar}"
        : > "$toolchain_file"
        record_toolchain() {
          "$@" 2>&1 | tee -a "$toolchain_file"
        }
        record_toolchain printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
        record_toolchain printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
        record_toolchain "$OVERRIDE_CC" --version
        record_toolchain "$OVERRIDE_CXX" --version
        if ! record_toolchain "$ar_tool" --version; then
          if ! record_toolchain "$ar_tool" -V; then
            record_toolchain command -v "$ar_tool"
          fi
        fi
        record_toolchain make --version
        record_toolchain "$CI_PYTHON" --version
        case "$CI_INSTALL_KIND" in
          apt)
            record_toolchain dpkg-query --show \
              --showformat='${binary:Package}=${Version}\n' $CI_PACKAGES
            ;;
          brew)
            record_toolchain brew list --versions
            ;;
          msys2)
            record_toolchain pacman -Q $CI_PACKAGES
            ;;
        esac
        dependency_prefix="$("$CI_PYTHON" scripts/build/ci_shards.py \
          context "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}" \
          --toolchain-file "$toolchain_file" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "dependency-prefix=$dependency_prefix" >> "$GITHUB_OUTPUT"
        echo "dependency-key=${dependency_prefix}${GITHUB_SHA}" \
          >> "$GITHUB_OUTPUT"
    - name: Restore dependency manifest
      id: dependencies
      uses: actions/cache@main
      with:
        path: build/ci-shards/${{ steps.profile.outputs.profile_id }}/${{ matrix.group }}/dependency-state
        key: ${{ steps.cache-context.outputs.dependency-key }}
        restore-keys: |
          ${{ steps.cache-context.outputs.dependency-prefix }}
    - name: Materialize generated dependencies
      run: |
        "$CI_PYTHON" scripts/build/ci_shards.py materialize \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}" \
          --toolchain-file \
            "build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}/toolchain.txt" \
          --dependency-manifest \
            "build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}/dependency-state/dependency-manifest-${{ matrix.group }}.json" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}"
    - name: Prepare shard cache key
      id: cache-key
      run: |
        set -euo pipefail
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        key="$("$CI_PYTHON" scripts/build/ci_shards.py prepare \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}" \
          --toolchain-file "$state_root/toolchain.txt" \
          --manifest "$state_root/cache-manifest.json" \
          --dependency-manifest \
            "$state_root/dependency-state/dependency-manifest-${{ matrix.group }}.json" \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Restore shard cache
      id: shard-cache
      uses: actions/cache/restore@main
      with:
        path: build/ci-shards/${{ steps.profile.outputs.profile_id }}/${{ matrix.group }}/artifact
        key: ${{ steps.cache-key.outputs.key }}
    - name: Build shard
      if: steps.shard-cache.outputs.cache-hit != 'true'
      env:
        COLLECT_TIMINGS: ${{ steps.profile.outputs.collect_timings }}
      run: |
        set -euo pipefail
        timing_dir="$PWD/build/ci-shards/$CI_PROFILE_ID/project-timings"
        if [[ "$PRECOMPILE" != "0" && "${{ matrix.group }}" != "thirdparty" ]]; then
          make -j"$CI_MAKE_JOBS" -C "$CI_SOLUTION_DIR" \
            config="$CI_CONFIGURATION" precompile
        fi
        if [[ "$COLLECT_TIMINGS" == "true" ]]; then
          mkdir -p "$timing_dir"
          export MAME_PROJECT_TIMING_DIR="$timing_dir"
          "$CI_PYTHON" scripts/build/instrument_solution_makefile.py \
            "$CI_SOLUTION_DIR/Makefile"
        fi
        projects="$("$CI_PYTHON" scripts/build/ci_shards.py list \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}")"
        make -j"$CI_MAKE_JOBS" -C "$CI_SOLUTION_DIR" \
          config="$CI_CONFIGURATION" $projects
    - name: Capture compiler dependencies
      if: steps.shard-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        "$CI_PYTHON" scripts/build/ci_shards.py capture \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}" \
          --toolchain-file "$state_root/toolchain.txt" \
          --dependency-root "$CI_BUILD_ROOT" \
          --manifest \
            "$state_root/dependency-state/dependency-manifest-${{ matrix.group }}.json" \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}"
    - name: Finalize shard cache key
      id: final-cache-key
      if: steps.shard-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        key="$("$CI_PYTHON" scripts/build/ci_shards.py prepare \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}" \
          --toolchain-file "$state_root/toolchain.txt" \
          --manifest "$state_root/cache-manifest.json" \
          --dependency-manifest \
            "$state_root/dependency-state/dependency-manifest-${{ matrix.group }}.json" \
          --require-dependency-manifest \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Stage shard artifact
      if: steps.shard-cache.outputs.cache-hit != 'true'
      env:
        COLLECT_TIMINGS: ${{ steps.profile.outputs.collect_timings }}
      run: |
        set -euo pipefail
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        stage_shard() {
          "$CI_PYTHON" scripts/build/ci_shards.py stage \
            "$CI_SOLUTION_DIR/Makefile" \
            --profile "$CI_PROFILE_PATH" \
            --group "${{ matrix.group }}" \
            --build-root "$CI_BUILD_ROOT" \
            --cache-root "$state_root/artifact" \
            --cache-manifest "$state_root/cache-manifest.json" \
            --dependency-manifest \
              "$state_root/dependency-state/dependency-manifest-${{ matrix.group }}.json" \
            "$@"
        }
        if [[ "$COLLECT_TIMINGS" == "true" ]]; then
          stage_shard --timing-dir \
            "build/ci-shards/$CI_PROFILE_ID/project-timings"
        else
          stage_shard
        fi
    - name: Verify shard artifact
      run: |
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        "$CI_PYTHON" scripts/build/ci_shards.py verify \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}" \
          --expected-manifest "$state_root/cache-manifest.json" \
          --cache-root "$state_root/artifact"
    - name: Stamp current shard definition
      run: |
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        "$CI_PYTHON" scripts/build/ci_shards.py write-definition \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" \
          --group "${{ matrix.group }}" \
          --output \
            "$state_root/artifact/shard-definition-${{ matrix.group }}.json"
    - name: Refresh dependency manifest
      run: |
        set -euo pipefail
        state_root="build/ci-shards/$CI_PROFILE_ID/${{ matrix.group }}"
        mkdir -p "$state_root/dependency-state"
        cp "$state_root/artifact/dependency-manifest-${{ matrix.group }}.json" \
          "$state_root/dependency-state/dependency-manifest-${{ matrix.group }}.json"
    - name: Upload shard artifact
      uses: actions/upload-artifact@main
      with:
        name: mame-ci-${{ steps.profile.outputs.profile_id }}-shard-${{ matrix.group }}-${{ github.sha }}
        path: build/ci-shards/${{ steps.profile.outputs.profile_id }}/${{ matrix.group }}/artifact/
        if-no-files-found: error
    - name: Save shard cache
      if: steps.shard-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@main
      with:
        path: build/ci-shards/${{ steps.profile.outputs.profile_id }}/${{ matrix.group }}/artifact
        key: ${{ steps.final-cache-key.outputs.key }}

  link-and-validate:
    name: link (${{ inputs.profile_id }})
    needs:
    - build-shards
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: ${{ inputs.shell }}
    env:
      CI_PACKAGES: ${{ inputs.packages }}
      CI_PYTHON: ${{ inputs.python }}
    steps:
    - name: Set up MSYS2
      if: inputs.install_kind == 'msys2'
      uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
      with:
        msystem: ${{ inputs.msystem }}
        install: ${{ inputs.packages }}
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Validate profile inputs
      id: profile
      run: |
        set -euo pipefail
        "$CI_PYTHON" scripts/build/ci_shards.py github-env \
          --profile "${{ inputs.profile_path }}" \
          --group all \
          --expected-profile-id "${{ inputs.profile_id }}" \
          --expected-runner "${{ inputs.runner }}" \
          --expected-shell "${{ inputs.shell }}" \
          --expected-install-kind "${{ inputs.install_kind }}" \
          --expected-msystem "${{ inputs.msystem }}" \
          --expected-packages "$CI_PACKAGES" \
          --expected-python "${{ inputs.python }}" \
          --github-output "$GITHUB_OUTPUT" \
          --github-env "$GITHUB_ENV"
    - name: Install apt dependencies
      if: inputs.install_kind == 'apt'
      run: |
        sudo apt-get update
        sudo apt-get install -y $CI_PACKAGES
    - name: Install Homebrew dependencies
      if: inputs.install_kind == 'brew'
      run: brew install $CI_PACKAGES
    - name: Generate final build files
      run: |
        set -euo pipefail
        make -j"$CI_MAKE_JOBS" generate
        make "$CI_SOLUTION_DIR/Makefile"
        "$CI_PYTHON" scripts/build/ci_shards.py validate \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" --group all
    - name: Download shard artifacts
      uses: actions/download-artifact@main
      with:
        pattern: mame-ci-${{ steps.profile.outputs.profile_id }}-shard-*-${{ github.sha }}
        path: .
        merge-multiple: true
    - name: Verify shard definitions and archives
      run: |
        set -euo pipefail
        "$CI_PYTHON" scripts/build/ci_shards.py verify-definitions \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" --manifest-dir .
        "$CI_PYTHON" scripts/build/ci_shards.py verify-archives \
          "$CI_SOLUTION_DIR/Makefile" \
          --profile "$CI_PROFILE_PATH" --group all \
          --archive-dir "$CI_BUILD_ROOT"
    - name: Build final tools
      env:
        COLLECT_TIMINGS: ${{ steps.profile.outputs.collect_timings }}
      run: |
        set -euo pipefail
        timing_dir="$PWD/build/ci-shards/$CI_PROFILE_ID/project-timings"
        mkdir -p "$timing_dir"
        for project in $CI_FINAL_PROJECTS; do
          if [[ "$COLLECT_TIMINGS" == "true" ]]; then
            /usr/bin/time -a -f '%e %U %S %M %x' \
              -o "$timing_dir/${project}.timing" \
              make -j"$CI_MAKE_JOBS" -C "$CI_SOLUTION_DIR" \
                -f "${project}.make" config="$CI_CONFIGURATION"
          else
            make -j"$CI_MAKE_JOBS" -C "$CI_SOLUTION_DIR" \
              -f "${project}.make" config="$CI_CONFIGURATION"
          fi
          test -x "./${project}${CI_EXECUTABLE_SUFFIX}"
        done
    - name: Link executable
      env:
        COLLECT_TIMINGS: ${{ steps.profile.outputs.collect_timings }}
      run: |
        set -euo pipefail
        timing_dir="$PWD/build/ci-shards/$CI_PROFILE_ID/project-timings"
        if [[ "$COLLECT_TIMINGS" == "true" ]]; then
          /usr/bin/time -a -f '%e %U %S %M %x' \
            -o "$timing_dir/$CI_EXECUTABLE_PROJECT.timing" \
            make -j"$CI_MAKE_JOBS" -C "$CI_SOLUTION_DIR" \
              -f "$CI_EXECUTABLE_PROJECT.make" \
              config="$CI_CONFIGURATION"
        else
          make -j"$CI_MAKE_JOBS" -C "$CI_SOLUTION_DIR" \
            -f "$CI_EXECUTABLE_PROJECT.make" \
            config="$CI_CONFIGURATION"
        fi
        test -x "$CI_EXECUTABLE"
    - name: Summarize project timings
      if: steps.profile.outputs.collect_timings == 'true'
      run: |
        timing_root="build/ci-shards/$CI_PROFILE_ID"
        "$CI_PYTHON" scripts/build/summarize_project_timings.py \
          --input-dir "$timing_root/project-timings" \
          --csv "$timing_root/project-timings.csv" \
          --markdown "$timing_root/project-timings.md"
        cat "$timing_root/project-timings.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload project timings
      if: steps.profile.outputs.collect_timings == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ steps.profile.outputs.artifact_name }}-project-timings-${{ github.sha }}
        path: |
          build/ci-shards/${{ steps.profile.outputs.profile_id }}/project-timings.csv
          build/ci-shards/${{ steps.profile.outputs.profile_id }}/project-timings.md
          build/ci-shards/${{ steps.profile.outputs.profile_id }}/project-timings/*.timing
        if-no-files-found: error
    - name: Validate
      run: |
        "$CI_EXECUTABLE" -validate
    - name: Reconcile driver list
      if: steps.profile.outputs.reconcile_list != ''
      run: |
        set -euo pipefail
        "$CI_EXECUTABLE" -listxml | "$CI_PYTHON" \
          scripts/build/makedep.py reconcilelist \
          -l "$CI_RECONCILE_LIST" -
    - name: ORM check
      if: steps.profile.outputs.run_orm == 'true'
      run: |
        "$CI_PYTHON" scripts/minimaws/minimaws.py load \
          --executable "$CI_EXECUTABLE" --softwarepath hash
    - name: Upload executables
      uses: actions/upload-artifact@main
      with:
        name: ${{ steps.profile.outputs.artifact_name }}-${{ github.sha }}
        path: |
          ${{ steps.profile.outputs.executable }}
          ./chdman${{ steps.profile.outputs.executable_suffix }}
          ./unidasm${{ steps.profile.outputs.executable_suffix }}
        if-no-files-found: error
