name: CI (Linux)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'hash/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'hash/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

env:
  CLANG_SOLUTION_DIR: build/projects/sdl/mame/gmake-linux-clang
  CLANG_DRIVER_ARCHIVE_DIR: build/linux_clang/bin/x64/Release/mame_mame
  CLANG_TIMING_DIR: build/ci-project-timings

jobs:
  build-linux:
    strategy:
      matrix:
        compiler: [gcc]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            archopts: -U_FORTIFY_SOURCE
            subtarget: tiny
            executable: mametiny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Build
      env:
        OVERRIDE_CC: ${{ matrix.cc }}
        OVERRIDE_CXX: ${{ matrix.cxx }}
        ARCHOPTS: ${{ matrix.archopts }}
        SUBTARGET: ${{ matrix.subtarget }}
        TOOLS: 1
      run: make -j3
    - name: Validate
      run: ./${{ matrix.executable }} -validate
    - name: Reconcile driver list
      run: ./${{ matrix.executable }} -listxml | python scripts/build/makedep.py reconcilelist -l src/mame/${{ matrix.subtarget }}.lst -
    - name: ORM check
      run: python scripts/minimaws/minimaws.py load --executable ./${{ matrix.executable }} --softwarepath hash
    - uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.executable }}-linux-${{ matrix.compiler }}-${{ github.sha }}
        path: |
          ${{ matrix.executable }}
          chdman
          unidasm
        if-no-files-found: error

  build-linux-clang-libraries:
    name: build-linux (clang ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group:
        - core
        - optional
        - thirdparty
    runs-on: ubuntu-latest
    env:
      OVERRIDE_CC: clang
      OVERRIDE_CXX: clang++
      SUBTARGET: mame
      TOOLS: 1
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools time
    - name: Build library shard
      run: |
        set -euo pipefail
        make -j3 generate
        make "$CLANG_SOLUTION_DIR/Makefile"
        python scripts/build/ci_linux_clang_driver_buckets.py \
          validate "$CLANG_SOLUTION_DIR/Makefile"
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        python scripts/build/instrument_solution_makefile.py \
          "$CLANG_SOLUTION_DIR/Makefile"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}")"
        make -j3 -C "$CLANG_SOLUTION_DIR" config=release64 $projects
    - name: Stage library artifacts
      run: |
        set -euo pipefail
        artifact_root=build/ci-linux-clang-${{ matrix.group }}-artifact
        mkdir -p "$artifact_root"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}")"
        for project in $projects; do
          mapfile -t archives < <(find build/linux_clang/bin/x64/Release \
            -type f -name "lib${project}.a")
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one archive for ${project}, found ${#archives[@]}" >&2
            exit 1
          fi
          cp --parents "${archives[0]}" "$artifact_root"
        done
        cp --parents "$CLANG_TIMING_DIR"/*.timing "$artifact_root"
    - name: Upload library artifacts
      uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-shard-${{ matrix.group }}-${{ github.sha }}
        path: build/ci-linux-clang-${{ matrix.group }}-artifact/
        if-no-files-found: error

  build-linux-clang-drivers:
    name: build-linux (clang ${{ matrix.bucket }})
    strategy:
      fail-fast: false
      matrix:
        bucket:
        - driver-1
        - driver-2
        - driver-3
        - driver-4
        - driver-5
        - driver-6
        - driver-7
        - driver-8
    runs-on: ubuntu-latest
    env:
      OVERRIDE_CC: clang
      OVERRIDE_CXX: clang++
      SUBTARGET: mame
      TOOLS: 1
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools time
    - name: Build driver bucket
      run: |
        set -euo pipefail
        make -j3 generate
        make "$CLANG_SOLUTION_DIR/Makefile"
        python scripts/build/ci_linux_clang_driver_buckets.py \
          validate "$CLANG_SOLUTION_DIR/Makefile"
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        python scripts/build/instrument_solution_makefile.py \
          "$CLANG_SOLUTION_DIR/Makefile"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" --group "${{ matrix.bucket }}")"
        make -j3 -C "$CLANG_SOLUTION_DIR" config=release64 $projects
        python scripts/build/ci_linux_clang_driver_buckets.py \
          verify-archives "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --archive-dir "$CLANG_DRIVER_ARCHIVE_DIR"
    - name: Stage driver artifacts
      run: |
        set -euo pipefail
        artifact_root=build/ci-linux-clang-${{ matrix.bucket }}-artifact
        mkdir -p "$artifact_root"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" --group "${{ matrix.bucket }}")"
        for project in $projects; do
          cp --parents "$CLANG_DRIVER_ARCHIVE_DIR/lib${project}.a" \
            "$artifact_root"
        done
        cp --parents "$CLANG_TIMING_DIR"/*.timing "$artifact_root"
    - name: Upload driver artifacts
      uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-shard-${{ matrix.bucket }}-${{ github.sha }}
        path: build/ci-linux-clang-${{ matrix.bucket }}-artifact/
        if-no-files-found: error

  build-linux-clang:
    name: build-linux (clang)
    needs:
    - build-linux-clang-libraries
    - build-linux-clang-drivers
    runs-on: ubuntu-latest
    env:
      OVERRIDE_CC: clang
      OVERRIDE_CXX: clang++
      SUBTARGET: mame
      TOOLS: 1
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools time
    - name: Generate build files
      run: |
        set -euo pipefail
        make -j3 generate
        make "$CLANG_SOLUTION_DIR/Makefile"
        python scripts/build/ci_linux_clang_driver_buckets.py \
          validate "$CLANG_SOLUTION_DIR/Makefile"
    - name: Download shard artifacts
      uses: actions/download-artifact@main
      with:
        pattern: mame-linux-clang-shard-*-${{ github.sha }}
        path: .
        merge-multiple: true
    - name: Build tools
      run: |
        set -euo pipefail
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        for project in chdman unidasm; do
          /usr/bin/time -a -f '%e %U %S %M %x' \
            -o "$MAME_PROJECT_TIMING_DIR/${project}.timing" \
            make -j3 -C "$CLANG_SOLUTION_DIR" -f "${project}.make" \
              config=release64
        done
    - name: Link MAME
      run: |
        set -euo pipefail
        python scripts/build/ci_linux_clang_driver_buckets.py \
          verify-archives "$CLANG_SOLUTION_DIR/Makefile" --group all \
          --archive-dir "$CLANG_DRIVER_ARCHIVE_DIR"
        test -x chdman
        test -x unidasm
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        /usr/bin/time -a -f '%e %U %S %M %x' \
          -o "$MAME_PROJECT_TIMING_DIR/mame.timing" \
          make -j3 -C "$CLANG_SOLUTION_DIR" -f mame.make config=release64
    - name: Summarize project timings
      run: |
        python scripts/build/summarize_project_timings.py \
          --input-dir "$CLANG_TIMING_DIR" \
          --csv build/ci-project-timings.csv \
          --markdown build/ci-project-timings.md
        cat build/ci-project-timings.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload project timings
      uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-project-timings-${{ github.sha }}
        path: |
          build/ci-project-timings.csv
          build/ci-project-timings.md
          build/ci-project-timings/*.timing
        if-no-files-found: error
    - name: Validate
      run: ./mame -validate
    - name: Reconcile driver list
      run: ./mame -listxml | python scripts/build/makedep.py reconcilelist -l src/mame/mame.lst -
    - name: ORM check
      run: python scripts/minimaws/minimaws.py load --executable ./mame --softwarepath hash
    - uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-${{ github.sha }}
        path: |
          mame
          chdman
          unidasm
        if-no-files-found: error
