name: CI (Linux)

on:
  push:
    paths:
    - '.github/ci-linux-clang-driver-shards.json'
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'hash/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/ci-linux-clang-driver-shards.json'
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'hash/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

env:
  CLANG_SOLUTION_DIR: build/projects/sdl/mame/gmake-linux-clang
  CLANG_DRIVER_ARCHIVE_DIR: build/linux_clang/bin/x64/Release/mame_mame
  CLANG_TIMING_DIR: build/ci-project-timings

jobs:
  build-linux:
    strategy:
      matrix:
        compiler: [gcc]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            archopts: -U_FORTIFY_SOURCE
            subtarget: tiny
            executable: mametiny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Build
      env:
        OVERRIDE_CC: ${{ matrix.cc }}
        OVERRIDE_CXX: ${{ matrix.cxx }}
        ARCHOPTS: ${{ matrix.archopts }}
        SUBTARGET: ${{ matrix.subtarget }}
        TOOLS: 1
      run: make -j3
    - name: Validate
      run: ./${{ matrix.executable }} -validate
    - name: Reconcile driver list
      run: ./${{ matrix.executable }} -listxml | python scripts/build/makedep.py reconcilelist -l src/mame/${{ matrix.subtarget }}.lst -
    - name: ORM check
      run: python scripts/minimaws/minimaws.py load --executable ./${{ matrix.executable }} --softwarepath hash
    - uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.executable }}-linux-${{ matrix.compiler }}-${{ github.sha }}
        path: |
          ${{ matrix.executable }}
          chdman
          unidasm
        if-no-files-found: error

  build-linux-clang-libraries:
    name: build-linux (clang ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group:
        - core
        - optional
        - thirdparty
    runs-on: ubuntu-latest
    env:
      OVERRIDE_CC: clang
      OVERRIDE_CXX: clang++
      SUBTARGET: mame
      TOOLS: 1
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools time
    - name: Generate library shard
      run: |
        set -euo pipefail
        make -j3 generate
        make "$CLANG_SOLUTION_DIR/Makefile"
        python scripts/build/ci_linux_clang_driver_buckets.py \
          validate "$CLANG_SOLUTION_DIR/Makefile"
    - name: Prepare library cache context
      id: library-cache-context
      run: |
        set -euo pipefail
        toolchain_file=build/ci-linux-clang-toolchain.txt
        {
          printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
          printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
          clang --version
          clang++ --version
          ar --version
          make --version
          python --version
          dpkg-query --show --showformat='${binary:Package}=${Version}\n' \
            clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev \
            libasound2-dev libxinerama-dev libxi-dev qt6-base-dev \
            qt6-base-dev-tools
        } > "$toolchain_file"
        dependency_prefix="$(python \
          scripts/build/ci_linux_clang_shard_cache.py \
          context "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}" \
          --toolchain-file "$toolchain_file" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "dependency-prefix=$dependency_prefix" >> "$GITHUB_OUTPUT"
        echo "dependency-key=${dependency_prefix}${GITHUB_SHA}" \
          >> "$GITHUB_OUTPUT"
    - name: Restore library dependency manifest
      id: library-dependencies
      uses: actions/cache@main
      with:
        path: build/ci-linux-clang-${{ matrix.group }}-dependency-state
        key: ${{ steps.library-cache-context.outputs.dependency-key }}
        restore-keys: |
          ${{ steps.library-cache-context.outputs.dependency-prefix }}
    - name: Prepare library shard cache
      id: library-cache-key
      run: |
        set -euo pipefail
        toolchain_file=build/ci-linux-clang-toolchain.txt
        current_manifest=build/ci-linux-clang-${{ matrix.group }}-manifest.json
        dependency_manifest=build/ci-linux-clang-${{ matrix.group }}-dependency-state/dependency-manifest-${{ matrix.group }}.json
        cache_key="$(python scripts/build/ci_linux_clang_shard_cache.py \
          prepare "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}" \
          --toolchain-file "$toolchain_file" \
          --manifest "$current_manifest" \
          --dependency-manifest "$dependency_manifest" \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "key=$cache_key" >> "$GITHUB_OUTPUT"
    - name: Restore library shard cache
      id: library-cache
      uses: actions/cache/restore@main
      with:
        path: build/ci-linux-clang-${{ matrix.group }}-artifact
        key: ${{ steps.library-cache-key.outputs.key }}
    - name: Build library shard
      if: steps.library-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        python scripts/build/instrument_solution_makefile.py \
          "$CLANG_SOLUTION_DIR/Makefile"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}")"
        make -j3 -C "$CLANG_SOLUTION_DIR" config=release64 $projects
    - name: Capture library dependencies
      if: steps.library-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        dependency_manifest=build/ci-linux-clang-${{ matrix.group }}-dependency-state/dependency-manifest-${{ matrix.group }}.json
        python scripts/build/ci_linux_clang_shard_cache.py \
          capture "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}" \
          --toolchain-file build/ci-linux-clang-toolchain.txt \
          --dependency-root build/linux_clang \
          --manifest "$dependency_manifest" \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}"
    - name: Finalize library shard cache
      id: library-final-cache-key
      if: steps.library-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        current_manifest=build/ci-linux-clang-${{ matrix.group }}-manifest.json
        dependency_manifest=build/ci-linux-clang-${{ matrix.group }}-dependency-state/dependency-manifest-${{ matrix.group }}.json
        cache_key="$(python scripts/build/ci_linux_clang_shard_cache.py \
          prepare "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}" \
          --toolchain-file build/ci-linux-clang-toolchain.txt \
          --manifest "$current_manifest" \
          --dependency-manifest "$dependency_manifest" \
          --require-dependency-manifest \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "key=$cache_key" >> "$GITHUB_OUTPUT"
    - name: Stage library artifacts
      if: steps.library-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        artifact_root=build/ci-linux-clang-${{ matrix.group }}-artifact
        current_manifest=build/ci-linux-clang-${{ matrix.group }}-manifest.json
        dependency_manifest=build/ci-linux-clang-${{ matrix.group }}-dependency-state/dependency-manifest-${{ matrix.group }}.json
        rm -rf "$artifact_root"
        mkdir -p "$artifact_root"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}")"
        for project in $projects; do
          mapfile -t archives < <(find build/linux_clang/bin/x64/Release \
            -type f -name "lib${project}.a")
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one archive for ${project}, found ${#archives[@]}" >&2
            exit 1
          fi
          cp --parents "${archives[0]}" "$artifact_root"
        done
        cp --parents "$CLANG_TIMING_DIR"/*.timing "$artifact_root"
        while IFS= read -r -d '' dependency_file; do
          cp --parents "$dependency_file" "$artifact_root"
        done < <(find build/linux_clang -type f -name '*.d' -print0)
        cp "$current_manifest" \
          "$artifact_root/shard-manifest-${{ matrix.group }}.json"
        cp "$dependency_manifest" \
          "$artifact_root/dependency-manifest-${{ matrix.group }}.json"
    - name: Verify library shard artifacts
      run: |
        python scripts/build/ci_linux_clang_shard_cache.py \
          verify "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.group }}" \
          --expected-manifest \
            build/ci-linux-clang-${{ matrix.group }}-manifest.json \
          --cache-root \
            build/ci-linux-clang-${{ matrix.group }}-artifact
    - name: Refresh library dependency manifest
      run: |
        set -euo pipefail
        artifact_root=build/ci-linux-clang-${{ matrix.group }}-artifact
        dependency_state=build/ci-linux-clang-${{ matrix.group }}-dependency-state
        mkdir -p "$dependency_state"
        cp "$artifact_root/dependency-manifest-${{ matrix.group }}.json" \
          "$dependency_state/dependency-manifest-${{ matrix.group }}.json"
    - name: Upload library artifacts
      uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-shard-${{ matrix.group }}-${{ github.sha }}
        path: build/ci-linux-clang-${{ matrix.group }}-artifact/
        if-no-files-found: error
    - name: Save library shard cache
      if: steps.library-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@main
      with:
        path: build/ci-linux-clang-${{ matrix.group }}-artifact
        key: ${{ steps.library-final-cache-key.outputs.key }}

  build-linux-clang-drivers:
    name: build-linux (clang ${{ matrix.bucket }})
    strategy:
      fail-fast: false
      matrix:
        bucket:
        - driver-1
        - driver-2
        - driver-3
        - driver-4
        - driver-5
        - driver-6
        - driver-7
        - driver-8
    runs-on: ubuntu-latest
    env:
      OVERRIDE_CC: clang
      OVERRIDE_CXX: clang++
      SUBTARGET: mame
      TOOLS: 1
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools time
    - name: Generate driver bucket
      run: |
        set -euo pipefail
        make -j3 generate
        make "$CLANG_SOLUTION_DIR/Makefile"
        python scripts/build/ci_linux_clang_driver_buckets.py \
          validate "$CLANG_SOLUTION_DIR/Makefile"
    - name: Prepare driver cache context
      id: driver-cache-context
      run: |
        set -euo pipefail
        toolchain_file=build/ci-linux-clang-toolchain.txt
        {
          printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
          printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
          clang --version
          clang++ --version
          ar --version
          make --version
          python --version
          dpkg-query --show --showformat='${binary:Package}=${Version}\n' \
            clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev \
            libasound2-dev libxinerama-dev libxi-dev qt6-base-dev \
            qt6-base-dev-tools
        } > "$toolchain_file"
        dependency_prefix="$(python \
          scripts/build/ci_linux_clang_shard_cache.py \
          context "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --toolchain-file "$toolchain_file" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "dependency-prefix=$dependency_prefix" >> "$GITHUB_OUTPUT"
        echo "dependency-key=${dependency_prefix}${GITHUB_SHA}" \
          >> "$GITHUB_OUTPUT"
    - name: Restore driver dependency manifest
      id: driver-dependencies
      uses: actions/cache@main
      with:
        path: build/ci-linux-clang-${{ matrix.bucket }}-dependency-state
        key: ${{ steps.driver-cache-context.outputs.dependency-key }}
        restore-keys: |
          ${{ steps.driver-cache-context.outputs.dependency-prefix }}
    - name: Prepare driver bucket cache
      id: driver-cache-key
      run: |
        set -euo pipefail
        toolchain_file=build/ci-linux-clang-toolchain.txt
        current_manifest=build/ci-linux-clang-${{ matrix.bucket }}-manifest.json
        dependency_manifest=build/ci-linux-clang-${{ matrix.bucket }}-dependency-state/dependency-manifest-${{ matrix.bucket }}.json
        cache_key="$(python scripts/build/ci_linux_clang_shard_cache.py \
          prepare "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --toolchain-file "$toolchain_file" \
          --manifest "$current_manifest" \
          --dependency-manifest "$dependency_manifest" \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "key=$cache_key" >> "$GITHUB_OUTPUT"
    - name: Restore driver bucket cache
      id: driver-cache
      uses: actions/cache/restore@main
      with:
        path: build/ci-linux-clang-${{ matrix.bucket }}-artifact
        key: ${{ steps.driver-cache-key.outputs.key }}
    - name: Build driver bucket
      if: steps.driver-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        python scripts/build/instrument_solution_makefile.py \
          "$CLANG_SOLUTION_DIR/Makefile"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" --group "${{ matrix.bucket }}")"
        make -j3 -C "$CLANG_SOLUTION_DIR" config=release64 $projects
        python scripts/build/ci_linux_clang_driver_buckets.py \
          verify-archives "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --archive-dir "$CLANG_DRIVER_ARCHIVE_DIR"
    - name: Capture driver dependencies
      if: steps.driver-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        dependency_manifest=build/ci-linux-clang-${{ matrix.bucket }}-dependency-state/dependency-manifest-${{ matrix.bucket }}.json
        python scripts/build/ci_linux_clang_shard_cache.py \
          capture "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --toolchain-file build/ci-linux-clang-toolchain.txt \
          --dependency-root build/linux_clang \
          --manifest "$dependency_manifest" \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}"
    - name: Finalize driver shard cache
      id: driver-final-cache-key
      if: steps.driver-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        current_manifest=build/ci-linux-clang-${{ matrix.bucket }}-manifest.json
        dependency_manifest=build/ci-linux-clang-${{ matrix.bucket }}-dependency-state/dependency-manifest-${{ matrix.bucket }}.json
        cache_key="$(python scripts/build/ci_linux_clang_shard_cache.py \
          prepare "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --toolchain-file build/ci-linux-clang-toolchain.txt \
          --manifest "$current_manifest" \
          --dependency-manifest "$dependency_manifest" \
          --require-dependency-manifest \
          --source-commit "$GITHUB_SHA" \
          --runner-os "${{ runner.os }}" \
          --runner-arch "${{ runner.arch }}")"
        echo "key=$cache_key" >> "$GITHUB_OUTPUT"
    - name: Stage driver artifacts
      if: steps.driver-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        artifact_root=build/ci-linux-clang-${{ matrix.bucket }}-artifact
        current_manifest=build/ci-linux-clang-${{ matrix.bucket }}-manifest.json
        dependency_manifest=build/ci-linux-clang-${{ matrix.bucket }}-dependency-state/dependency-manifest-${{ matrix.bucket }}.json
        rm -rf "$artifact_root"
        mkdir -p "$artifact_root"
        projects="$(python scripts/build/ci_linux_clang_driver_buckets.py \
          list "$CLANG_SOLUTION_DIR/Makefile" --group "${{ matrix.bucket }}")"
        for project in $projects; do
          cp --parents "$CLANG_DRIVER_ARCHIVE_DIR/lib${project}.a" \
            "$artifact_root"
        done
        cp --parents "$CLANG_TIMING_DIR"/*.timing "$artifact_root"
        while IFS= read -r -d '' dependency_file; do
          cp --parents "$dependency_file" "$artifact_root"
        done < <(find build/linux_clang -type f -name '*.d' -print0)
        cp "$current_manifest" \
          "$artifact_root/shard-manifest-${{ matrix.bucket }}.json"
        cp "$dependency_manifest" \
          "$artifact_root/dependency-manifest-${{ matrix.bucket }}.json"
    - name: Stamp driver shard definition
      run: |
        set -euo pipefail
        artifact_root=build/ci-linux-clang-${{ matrix.bucket }}-artifact
        python scripts/build/ci_linux_clang_driver_buckets.py \
          write-definition "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --output \
            "$artifact_root/driver-shard-definition-${{ matrix.bucket }}.json"
    - name: Verify driver shard artifacts
      run: |
        python scripts/build/ci_linux_clang_shard_cache.py \
          verify "$CLANG_SOLUTION_DIR/Makefile" \
          --group "${{ matrix.bucket }}" \
          --expected-manifest \
            build/ci-linux-clang-${{ matrix.bucket }}-manifest.json \
          --cache-root \
            build/ci-linux-clang-${{ matrix.bucket }}-artifact
    - name: Refresh driver dependency manifest
      run: |
        set -euo pipefail
        artifact_root=build/ci-linux-clang-${{ matrix.bucket }}-artifact
        dependency_state=build/ci-linux-clang-${{ matrix.bucket }}-dependency-state
        mkdir -p "$dependency_state"
        cp "$artifact_root/dependency-manifest-${{ matrix.bucket }}.json" \
          "$dependency_state/dependency-manifest-${{ matrix.bucket }}.json"
    - name: Upload driver artifacts
      uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-shard-${{ matrix.bucket }}-${{ github.sha }}
        path: build/ci-linux-clang-${{ matrix.bucket }}-artifact/
        if-no-files-found: error
    - name: Save driver shard cache
      if: steps.driver-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@main
      with:
        path: build/ci-linux-clang-${{ matrix.bucket }}-artifact
        key: ${{ steps.driver-final-cache-key.outputs.key }}

  build-linux-clang:
    name: build-linux (clang)
    needs:
    - build-linux-clang-libraries
    - build-linux-clang-drivers
    runs-on: ubuntu-latest
    env:
      OVERRIDE_CC: clang
      OVERRIDE_CXX: clang++
      SUBTARGET: mame
      TOOLS: 1
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools time
    - name: Generate build files
      run: |
        set -euo pipefail
        make -j3 generate
        make "$CLANG_SOLUTION_DIR/Makefile"
        python scripts/build/ci_linux_clang_driver_buckets.py \
          validate "$CLANG_SOLUTION_DIR/Makefile"
    - name: Download shard artifacts
      uses: actions/download-artifact@main
      with:
        pattern: mame-linux-clang-shard-*-${{ github.sha }}
        path: .
        merge-multiple: true
    - name: Verify driver shard map
      run: |
        python scripts/build/ci_linux_clang_driver_buckets.py \
          verify-definitions "$CLANG_SOLUTION_DIR/Makefile" \
          --manifest-dir .
    - name: Build tools
      run: |
        set -euo pipefail
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        for project in chdman unidasm; do
          /usr/bin/time -a -f '%e %U %S %M %x' \
            -o "$MAME_PROJECT_TIMING_DIR/${project}.timing" \
            make -j3 -C "$CLANG_SOLUTION_DIR" -f "${project}.make" \
              config=release64
        done
    - name: Link MAME
      run: |
        set -euo pipefail
        python scripts/build/ci_linux_clang_driver_buckets.py \
          verify-archives "$CLANG_SOLUTION_DIR/Makefile" --group all \
          --archive-dir "$CLANG_DRIVER_ARCHIVE_DIR"
        test -x chdman
        test -x unidasm
        export MAME_PROJECT_TIMING_DIR="$PWD/$CLANG_TIMING_DIR"
        mkdir -p "$MAME_PROJECT_TIMING_DIR"
        /usr/bin/time -a -f '%e %U %S %M %x' \
          -o "$MAME_PROJECT_TIMING_DIR/mame.timing" \
          make -j3 -C "$CLANG_SOLUTION_DIR" -f mame.make config=release64
    - name: Summarize project timings
      run: |
        python scripts/build/summarize_project_timings.py \
          --input-dir "$CLANG_TIMING_DIR" \
          --csv build/ci-project-timings.csv \
          --markdown build/ci-project-timings.md
        cat build/ci-project-timings.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload project timings
      uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-project-timings-${{ github.sha }}
        path: |
          build/ci-project-timings.csv
          build/ci-project-timings.md
          build/ci-project-timings/*.timing
        if-no-files-found: error
    - name: Validate
      run: ./mame -validate
    - name: Reconcile driver list
      run: ./mame -listxml | python scripts/build/makedep.py reconcilelist -l src/mame/mame.lst -
    - name: ORM check
      run: python scripts/minimaws/minimaws.py load --executable ./mame --softwarepath hash
    - uses: actions/upload-artifact@main
      with:
        name: mame-linux-clang-${{ github.sha }}
        path: |
          mame
          chdman
          unidasm
        if-no-files-found: error
