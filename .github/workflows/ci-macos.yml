name: CI (macOS)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-macos:
    # macos-26 is Apple Silicon with Xcode 26.x.  Pinned so macos-latest
    # cannot silently move CI onto a newer image (for example Xcode 27).
    runs-on: macos-26
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: brew install python3 sdl3
    - name: Build
      env:
        USE_LIBSDL: 1
        TOOLS: 1
      run: make -j2
    - name: Validate
      run: ./mame -validate
    - uses: actions/upload-artifact@main
      with:
        name: mame-macos-${{ github.sha }}
        path: |
          mame
          chdman
          unidasm
        if-no-files-found: error
