name: CI (macOS cached)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-macos-cc:
    runs-on: macOS-latest
    permissions:
      actions: write
      contents: read
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: brew install python3 sdl3
    - name: Setup ccache
      uses: Chocobo1/setup-ccache-action@v1.5.9
      with:
        ccache_options: |
          max_size=8.0G
    - name: Prepare for complay cache
      run: |
        grep complay makefile >complay.prehash
        cat scripts/build/complay.py >>complay.prehash
    - name: cache complay-ed layouts
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/build/generated/mame/layout
        key: complay_${{ hashFiles('complay.prehash','**.lay') }}
    - name: Touch complay-ed layouts
      run: |
        if [ -d build/generated/mame/layout ]; then
          find build/generated/mame/layout -maxdepth 1 -name '*.lh' -exec touch {} +
        fi
    - name: Build
      env:
        USE_LIBSDL: 1
        TOOLS: 1
        PRECOMPILE: 0
      run: make -j2
    - name: Validate
      run: ./mame -validate
    - uses: actions/upload-artifact@main
      with:
        name: mame-macos-cc-${{ github.sha }}
        path: |
          mame
          chdman
          unidasm
        if-no-files-found: error
